<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Potdar Store - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#454747",
                        "secondary-container": "#e5e2e1",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#dde1ff",
                        "surface-container-high": "#e8e7f1",
                        "primary-container": "#0052ff",
                        "surface-container": "#eeedf7",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#001452",
                        "on-surface": "#1a1b22",
                        "outline": "#737688",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c3c5d9",
                        "on-secondary-fixed-variant": "#474646",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "on-tertiary-container": "#e4e5e5",
                        "on-error": "#ffffff",
                        "on-background": "#1a1b22",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-surface-variant": "#434656",
                        "inverse-surface": "#2f3038",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "secondary": "#5f5e5e",
                        "on-primary-container": "#dfe3ff",
                        "surface-bright": "#fbf8ff",
                        "primary-fixed-dim": "#b7c4ff",
                        "on-tertiary-fixed": "#1a1c1c",
                        "surface-container-highest": "#e3e1ec",
                        "secondary-fixed": "#e5e2e1",
                        "secondary-fixed-dim": "#c8c6c5",
                        "inverse-primary": "#b7c4ff",
                        "inverse-on-surface": "#f1effa",
                        "tertiary-container": "#656666",
                        "tertiary-fixed": "#e2e2e2",
                        "surface-tint": "#004ced",
                        "background": "#fbf8ff",
                        "surface-container-low": "#f4f2fd",
                        "on-secondary-container": "#656464",
                        "on-primary-fixed-variant": "#0038b6",
                        "surface-variant": "#e3e1ec",
                        "primary": "#003ec7",
                        "surface": "#fbf8ff",
                        "tertiary": "#4c4e4f",
                        "surface-dim": "#dad9e3",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit-xs": "4px",
                        "unit-sm": "8px",
                        "unit-xl": "48px",
                        "container-max": "1280px",
                        "gutter": "24px",
                        "margin-mobile": "20px",
                        "unit-lg": "24px",
                        "margin-desktop": "64px",
                        "unit-md": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased">
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-[400px]">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-unit-lg shadow-[0px_4px_20px_rgba(0,0,0,0.05)]">
<div class="text-center mb-unit-lg">
<h1 class="font-display-lg text-headline-lg text-primary mb-unit-sm">Potdar Store</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back. Please enter your details.</p>
</div>
<form class="space-y-unit-md">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-unit-xs" for="email">Mobile / Email</label>
<input class="w-full px-unit-md py-3 border border-outline-variant rounded-lg bg-surface font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors placeholder:text-outline" id="email" placeholder="Enter your mobile or email" type="text"/>
</div>
<div>
<div class="flex justify-between items-center mb-unit-xs">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full px-unit-md py-3 border border-outline-variant rounded-lg bg-surface font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="pt-unit-sm space-y-3">
<button class="w-full py-3 bg-primary-container text-on-primary border border-transparent rounded-lg font-label-md text-label-md hover:bg-primary transition-colors flex justify-center items-center gap-2" type="submit">
                            Login
                            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<button class="w-full py-3 bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg font-label-md text-label-md hover:border-primary-container transition-colors" type="button">
                            Create account
                        </button>
</div>
</form>
</div>
</div>
</main>
</body></html>
