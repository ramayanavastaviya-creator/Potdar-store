<!DOCTYPE html>

<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased pb-[80px]">
<!-- TopNavBar (Shared Component JSON adaptation for mobile context) -->
<header class="bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline w-full h-16 sticky top-0 z-40 flex justify-between items-center px-margin-mobile">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">storefront</span>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface dark:text-on-surface-variant">Dashboard</h1>
</div>
<button class="flex items-center gap-1 bg-surface-container-lowest border border-outline-variant rounded-full px-3 py-1.5 hover:bg-surface-container-low transition-colors text-label-sm font-label-sm text-on-surface">
            Today
            <span class="material-symbols-outlined text-[16px]">expand_more</span>
</button>
</header>
<main class="px-margin-mobile py-unit-lg flex flex-col gap-unit-xl">
<!-- Metrics Scrollable -->
<section class="flex gap-unit-md overflow-x-auto hide-scrollbar pb-unit-sm -mx-margin-mobile px-margin-mobile">
<!-- Sales Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-unit-md min-w-[140px] flex flex-col gap-2 shrink-0 shadow-[0px_4px_20px_rgba(0,0,0,0.02)]">
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-label-md text-label-md">Sales</span>
<span class="material-symbols-outlined text-[18px]">trending_up</span>
</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">₹45.2k</div>
<div class="font-label-sm text-label-sm text-primary">+12% vs yday</div>
</div>
<!-- Orders Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-unit-md min-w-[140px] flex flex-col gap-2 shrink-0 shadow-[0px_4px_20px_rgba(0,0,0,0.02)]">
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-label-md text-label-md">Orders</span>
<span class="material-symbols-outlined text-[18px]">shopping_bag</span>
</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-bold">124</div>
<div class="font-label-sm text-label-sm text-on-surface-variant">8 pending</div>
</div>
<!-- AOV Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-unit-md min-w-[140px] flex flex-col gap-2 shrink-0 shadow-[0px_4px_20px_rgba(0,0,0,0.02)]">
<div class="flex justify-between items-center text-on-surface-variant">
<span class="font-label-md text-label-md">AOV</span>
<span class="material-symbols-outlined text-[18px]">receipt_long</span>
</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-bold">₹365</div>
<div class="font-label-sm text-label-sm text-on-surface-variant">-2% vs yday</div>
</div>
</section>
<!-- Actionable Alerts -->
<section class="flex flex-col gap-unit-md">
<h2 class="font-headline-md text-headline-md text-on-surface font-semibold">Action Required</h2>
<div class="grid grid-cols-2 gap-unit-md">
<div class="bg-error-container text-on-error-container rounded-xl p-unit-md flex flex-col gap-2 border border-[#ffb4ab] active:scale-[0.98] transition-transform cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">warning</span>
<div class="font-headline-md text-headline-md font-bold">6</div>
<div class="font-label-sm text-label-sm">Orders to Action</div>
</div>
<div class="bg-surface-container-high rounded-xl p-unit-md flex flex-col gap-2 border border-outline-variant active:scale-[0.98] transition-transform cursor-pointer">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
<div class="font-headline-md text-headline-md font-bold text-on-surface">4</div>
<div class="font-label-sm text-label-sm text-on-surface-variant">Low Stock Items</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar Mobile Only -->
<nav class="md:hidden fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant px-margin-mobile py-2 flex justify-between items-center z-50">
<div class="flex flex-col items-center gap-1 text-primary cursor-pointer active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="font-label-sm text-label-sm font-bold">Dashboard</span>
</div>
<div class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-on-surface cursor-pointer active:scale-95 duration-150">
<span class="material-symbols-outlined">shopping_cart</span>
<span class="font-label-sm text-label-sm">Orders</span>
</div>
<div class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-on-surface cursor-pointer active:scale-95 duration-150">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-label-sm text-label-sm">Inventory</span>
</div>
<div class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-on-surface cursor-pointer active:scale-95 duration-150">
<span class="material-symbols-outlined">more_horiz</span>
<span class="font-label-sm text-label-sm">More</span>
</div>
</nav>
</body></html>
