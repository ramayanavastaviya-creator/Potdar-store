<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:hidden pb-[72px]">
<!-- Mobile Header (Simplified for Notifications) -->
<header class="sticky top-0 z-50 flex items-center justify-between w-full px-margin-mobile h-16 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-2">
<button class="text-on-surface p-1 rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Notifications</h1>
</div>
</header>
<!-- Main Content - Empty State -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile text-center h-[calc(100vh-64px-72px)]">
<!-- Animated Icon Container -->
<div class="relative w-32 h-32 mb-unit-lg flex items-center justify-center">
<div class="absolute inset-0 bg-surface-container-low rounded-full animate-pulse opacity-50"></div>
<span class="material-symbols-outlined text-[80px] text-outline" data-icon="notifications_off" style="font-variation-settings: 'FILL' 0;">notifications_off</span>
</div>
<!-- Copy -->
<h2 class="font-headline-md text-headline-md text-on-surface mb-unit-sm">You're all caught up</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mb-unit-xl">
            We'll notify you when there are updates on your orders or new offers.
        </p>
<!-- Action -->
<a class="inline-flex items-center justify-center px-6 py-3 bg-primary-container text-on-primary rounded-lg font-label-md text-label-md hover:bg-primary transition-colors" href="#">
            Back to Home
        </a>
</main>
<!-- Bottom Navigation Bar (Mobile) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex md:hidden justify-around items-center px-margin-mobile py-2 bg-surface border-t border-outline-variant">
<a class="flex flex-col items-center justify-center text-primary font-bold active:bg-surface-container-high scale-95 transition-transform p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary active:bg-surface-container-high transition-colors p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" data-icon="grid_view">grid_view</span>
<span class="font-label-sm text-label-sm">Categories</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary active:bg-surface-container-high transition-colors p-2 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" data-icon="receipt_long">receipt_long</span>
<span class="font-label-sm text-label-sm">Orders</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary active:bg-surface-container-high transition-colors p-2 rounded-lg relative" href="#">
<span class="material-symbols-outlined mb-1" data-icon="shopping_cart">shopping_cart</span>
<span class="font-label-sm text-label-sm">Cart</span>
</a>
</nav>
