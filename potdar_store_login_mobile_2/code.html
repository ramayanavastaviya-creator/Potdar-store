<style>
        /* Form Field Specific Styles mapping to Interaction System Spec */
        .form-input-minimal {
            border: 1px solid #E4E4E7;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

            border-color: #0052FF;
            box-shadow: 0 0 0 1px #0052FF;
            outline: none;
        }

        /* Material Symbols Fill override helper */
        .material-symbols-filled {
            font-variation-settings: 'FILL' 1;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center antialiased">
<!-- Main Container -->
<main class="w-full max-w-md px-margin-mobile py-unit-xl flex flex-col h-full md:h-auto bg-surface-container-lowest md:border border-outline-variant rounded-xl md:shadow-[0_4px_20px_rgba(0,0,0,0.05)]">
<!-- Header / Brand -->
<header class="mb-unit-xl text-center md:text-left mt-unit-xl md:mt-0">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-unit-sm">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to Potdar Store</p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-unit-md flex-grow justify-center md:flex-grow-0" onsubmit="event.preventDefault();">
<!-- Email / Mobile Number Field -->
<div class="flex flex-col gap-unit-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="emailOrMobile">Email or Mobile Number</label>
<div class="relative">
<input class="form-input-minimal w-full px-unit-md py-3 rounded bg-surface-container-lowest text-on-surface font-body-md placeholder-outline" id="emailOrMobile" name="emailOrMobile" placeholder="Enter email or mobile" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-unit-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative flex items-center">
<input class="form-input-minimal w-full pl-unit-md pr-12 py-3 rounded bg-surface-container-lowest text-on-surface font-body-md placeholder-outline" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-on-surface-variant hover:text-primary transition-colors p-1 flex items-center justify-center rounded-full focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordIcon">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-1">
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Spacer for mobile layout -->
<div class="flex-grow md:hidden"></div>
<!-- Actions -->
<div class="flex flex-col gap-unit-md mt-unit-lg md:mt-4">
<button class="w-full bg-primary-container text-on-primary py-3 px-unit-md rounded font-label-md text-label-md flex items-center justify-center hover:bg-on-primary-fixed-variant transition-colors active:scale-[0.98]" type="submit">
                    Log In
                </button>
<div class="relative flex items-center justify-center my-unit-sm">
<div class="absolute w-full border-t border-outline-variant"></div>
<span class="relative bg-surface-container-lowest px-4 font-label-sm text-label-sm text-on-surface-variant">OR</span>
</div>
<a class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface py-3 px-unit-md rounded font-label-md text-label-md flex items-center justify-center hover:border-primary hover:text-primary transition-colors active:bg-surface-container-low text-center" href="#">
                    Create Account
                </a>
</div>
</form>
</main>
<script>
        // Password Visibility Toggle Logic
        document.addEventListener('DOMContentLoaded', () => {
            const toggleButton = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');

            toggleButton.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                if (type === 'text') {
                    passwordIcon.textContent = 'visibility';
                    passwordIcon.classList.add('text-primary');
                } else {
                    passwordIcon.textContent = 'visibility_off';
                    passwordIcon.classList.remove('text-primary');
                }
            });
        });
    </script>
