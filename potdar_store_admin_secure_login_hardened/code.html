<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

</head>
<body class="bg-on-surface text-surface-container-lowest font-body-md antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Main Content Area -->
<main class="w-full max-w-[440px] flex flex-col items-center z-10 relative">
<!-- Logo -->
<div class="mb-unit-xl flex justify-center w-full">
<div class="h-16 w-16 md:h-20 md:w-20 rounded-lg overflow-hidden bg-surface-container-lowest flex items-center justify-center">
<img alt="Potdar Store Logo" class="h-full w-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1UJp1tNOKgNsymi3heUjPhdI1LPz79EsmsX2b0OvAQgev6Hb99mYT5u_fnFf-nlMdE3qX5BbUEIiFo9h1BjZQ6A6I6aNK5brlaU_mSvmgv7Q_kN3xJsl-leJPKtFWFWBOM4_VX45Y0wgzi9-N9XjwTOBRE58pAOntrHeUORMBHQUuaYcYHvBlllyNVnviQvj0NhfjMD8ju1vzmxS9QQl2rM23fbegR4USqyyZc2WrSXCq1AW2IEztgxmGjj"/>
</div>
</div>
<!-- Login Card -->
<div class="w-full bg-surface-container-lowest text-on-surface rounded-lg p-unit-lg md:p-10 border border-outline-variant shadow-2xl relative overflow-hidden">
<!-- Header -->
<div class="mb-8 text-center">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2 tracking-tight">Admin Login</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure access to management portal.</p>
</div>
<!-- Login Form -->
<form class="space-y-6" id="loginForm">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-DEFAULT bg-surface-bright text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-shadow duration-150" id="email" name="email" placeholder="admin@potdarstore.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-2">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors duration-150" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</span>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-DEFAULT bg-surface-bright text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-shadow duration-150" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface-variant transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- 2FA Prompt (Hidden by default, shown for demo) -->
<div class="hidden" id="twoFactorGroup">
<label class="block font-label-md text-label-md text-on-surface mb-2" for="twoFactor">Authentication Code</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="dialpad">dialpad</span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-DEFAULT bg-surface-bright text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-shadow duration-150 text-center tracking-widest text-lg" id="twoFactor" maxlength="7" name="twoFactor" placeholder="000 000" type="text"/>
</div>
<p class="mt-2 text-sm text-on-surface-variant text-center">Enter the code from your authenticator app.</p>
</div>
<!-- Action Button -->
<div class="pt-2">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-DEFAULT shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-colors duration-150 relative" id="submitBtn" type="submit">
<span id="btnText">Sign In</span>
<span class="material-symbols-outlined absolute right-4 hidden animate-spin" data-icon="progress_activity" id="loadingSpinner">progress_activity</span>
</button>
</div>
</form>
</div>
</main>
<!-- Footer -->
<footer class="absolute bottom-6 w-full text-center">
<div class="flex justify-center gap-6 font-label-sm text-label-sm text-outline hover:text-surface-container-lowest transition-colors duration-150 opacity-70">
<a class="hover:text-white" href="#">Privacy Policy</a>
<span class="text-surface-dim">•</span>
<a class="hover:text-white" href="#">Security Terms</a>
</div>
<p class="mt-4 font-label-sm text-label-sm text-outline opacity-50">© 2024 Potdar Store. All rights reserved.</p>
</footer>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const toggleIcon = togglePasswordBtn.querySelector('.material-symbols-outlined');
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const twoFactorGroup = document.getElementById('twoFactorGroup');
            
            let is2FAStage = false;

            // Password Toggle
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });

            // Form Submit Simulation
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Loading State
                btnText.classList.add('opacity-0');
                loadingSpinner.classList.remove('hidden');
                submitBtn.disabled = true;

                setTimeout(() => {
                    btnText.classList.remove('opacity-0');
                    loadingSpinner.classList.add('hidden');
                    submitBtn.disabled = false;

                    if (!is2FAStage) {
                        // Switch to 2FA view
                        is2FAStage = true;
                        document.getElementById('email').parentElement.parentElement.classList.add('hidden');
                        document.getElementById('password').parentElement.parentElement.classList.add('hidden');
                        twoFactorGroup.classList.remove('hidden');
                        btnText.textContent = 'Verify Code';
                        document.getElementById('twoFactor').focus();
                    } else {
                        // Success state (demo)
                        submitBtn.classList.replace('bg-primary-container', 'bg-green-600');
                        submitBtn.classList.replace('hover:bg-primary', 'hover:bg-green-700');
                        btnText.textContent = 'Success!';
                        btnText.innerHTML = '<span class="material-symbols-outlined align-middle mr-2">check_circle</span>Success!';
                    }
                }, 1500);
            });
            
            // Format 2FA input
            const tfaInput = document.getElementById('twoFactor');
            tfaInput.addEventListener('input', function (e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 3) {
                    value = value.substring(0, 3) + ' ' + value.substring(3, 6);
                }
                e.target.value = value;
            });
        });
    </script>
</body></html>
